<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeeHive — X Spark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Roboto', sans-serif; background: #0a0a0a; color: #fff; }
      @keyframes floatUp { 0% { opacity:1; transform:translateY(0) scale(1); } 100% { opacity:0; transform:translateY(-120px) scale(1.4); } }
      @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
      .controls-bar::-webkit-scrollbar { display: none; }

      /* ── Mobile responsive controls bar ─────────────────────────────── */
      @media (max-width: 640px) {
        .controls-bar {
          flex-wrap: wrap !important;
          max-width: calc(100vw - 20px) !important;
          justify-content: center !important;
          gap: 6px !important;
          padding: 8px 10px !important;
          border-radius: 16px !important;
          bottom: 10px !important;
        }
        /* Square icon buttons */
        .controls-bar > button,
        .controls-bar > div > button,
        .controls-bar [data-lk-source],
        .controls-bar lk-track-toggle,
        .controls-bar > div {
          width: 42px !important;
          height: 42px !important;
          min-width: 42px !important;
          min-height: 42px !important;
        }
        /* Shrink icons slightly */
        .controls-bar svg { width: 17px !important; height: 17px !important; }
        /* "Stop Sharing" text button — make it compact */
        .controls-bar button[title="Stop sharing"] {
          width: auto !important;
          padding: 0 10px !important;
          height: 38px !important;
          font-size: 11px !important;
        }
        /* Speaking indicator — float above the controls bar */
        .speaking-wrap {
          bottom: 115px !important;
        }
        /* Hide the full speaker video window on mobile — chip only */
        .speaking-wrap > div:first-child:not(.speaking-chip) {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
