# Security headers (HSTS, CSP, X-Frame-Options, etc.) do NOT belong in a
# `headers:` block here — Render's declarative headers config only applies
# to `type: web` services with `runtime: static`. This is `runtime: node`
# with a custom startCommand, so a `headers:` block here is silently
# ignored. The actual headers are set as Express middleware in
# livekit_node_backend.js — that's the only place that reaches the live
# response for this service. (A prior attempt put them here; the live site
# scored an F on security-header scans because this file's `headers:`
# never applied.)
services:
  - type: web
    name: beehive
    runtime: node
    branch: staging
    buildCommand: npm install && npm run build
    startCommand: node livekit_node_backend.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FATHOM_API_KEY
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Ops Dashboard — declared plan tiers (neither provider exposes its
      # plan to a plain API key). free | pro | team | enterprise and
      # build | ship | scale | enterprise. See /api/admin/overview.
      - key: SUPABASE_PLAN
        sync: false
      - key: LIVEKIT_CLOUD_PLAN
        sync: false
      - key: LARGE_SESSION_TARGET
        value: "300"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_LIVEKIT_URL
        sync: false
